name: Documentation Sync Check

on:
  push:
    branches: [main]
    paths:
      - 'backend/functions/**'
      - 'backend/src/**'
      - 'shared/src/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths:
      - 'backend/functions/**'
      - 'backend/src/**'
      - 'shared/src/**'
      - 'docs/**'
      - 'README.md'

jobs:
  doc-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check README freshness
        run: |
          README_DATE=$(git log -1 --format='%ci' -- README.md)
          echo "README.md last modified: $README_DATE"
          
          # Check if src files are newer than README
          NEWER_FILES=$(git log --since="$README_DATE" --format='%s' --name-only --diff-filter=M -- 'src/**' 'functions/**' | head -20)
          if [ -n "$NEWER_FILES" ]; then
            echo "Files modified after README.md:"
            echo "$NEWER_FILES"
            echo "Consider updating README.md"
          fi

      - name: Check API docs consistency
        run: |
          API_DOC="docs/api.md"
          if [ -f "$API_DOC" ]; then
            API_DATE=$(git log -1 --format='%ci' -- "$API_DOC")
            echo "API docs last modified: $API_DATE"
            
            # Check for Lambda changes that might need API doc updates
            NEWER_LAMBDAS=$(git log --since="$API_DATE" --format='%s' --name-only -- 'backend/functions/**' | grep -E '\.(js|ts)$' | head -10)
            if [ -n "$NEWER_LAMBDAS" ]; then
              echo "Lambda functions modified after API docs:"
              echo "$NEWER_LAMBDAS"
              echo "Consider updating docs/api.md"
            fi
          fi

      - name: Enforce doc updates for breaking changes
        run: |
          BREAKING_CHANGES=$(git log --format='%s' --grep="breaking" --since='30 days ago' | wc -l)
          if [ "$BREAKING_CHANGES" -gt 0 ]; then
            echo "Found $BREAKING_CHANGES commits with 'breaking' keyword in last 30 days."

            # Check if docs/api.md was recently updated
            API_DOC="docs/api.md"
            if [ -f "$API_DOC" ]; then
              API_DATE=$(git log -1 --format='%ci' -- "$API_DOC")
              STALE_LAMBDAS=$(git log --since="$API_DATE" --format='%s' \
                --name-only -- 'backend/functions/**' \
                | grep -E '\.(js|ts)$' | head -10 || true)
              if [ -n "$STALE_LAMBDAS" ]; then
                echo "ERROR: Breaking changes exist and docs/api.md has not been updated"
                echo "since these Lambda changes:"
                echo "$STALE_LAMBDAS"
                echo ""
                echo "Update docs/api.md to reflect the current API before merging."
                exit 1
              fi
            fi

            echo "docs/api.md appears up to date — OK."
          fi

      - name: Fail if API docs older than 30 days with Lambda changes
        run: |
          API_DOC="docs/api.md"
          if [ ! -f "$API_DOC" ]; then
            echo "docs/api.md not found — skipping age check."
            exit 0
          fi

          API_TIMESTAMP=$(git log -1 --format='%ct' -- "$API_DOC")
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - API_TIMESTAMP) / 86400 ))

          echo "docs/api.md age: ${AGE_DAYS} days"

          if [ "$AGE_DAYS" -gt 30 ]; then
            # Check if any Lambda functions changed in that period
            RECENT_LAMBDAS=$(git log --since="${AGE_DAYS} days ago" \
              --format='%s' --name-only -- 'backend/functions/**' \
              | grep -E '\.(js|ts)$' | head -5 || true)
            if [ -n "$RECENT_LAMBDAS" ]; then
              echo "ERROR: docs/api.md is ${AGE_DAYS} days old and Lambda functions"
              echo "have been modified in that period:"
              echo "$RECENT_LAMBDAS"
              echo ""
              echo "Review and update docs/api.md."
              exit 1
            fi
          fi

          echo "API doc freshness check passed."
